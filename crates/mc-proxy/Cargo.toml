[package]
name = "mc-proxy"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Microsoft/Xbox/Minecraft auth + WebSocket-to-TCP bridge so a browser client can join Java servers"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
futures-util = "0.3.34"
mc-proto = { version = "0.1.0", path = "../mc-proto" }
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "form", "rustls", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["full"] }
tower-http = { version = "0.7.1", features = ["fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
